packages:
  - apps/*
  - packages/*

# Pacotes que podem rodar script na instalação (o pnpm bloqueia os outros).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@lucide/vue@1.78.0'

# O openapi-typescript (o gerador do cliente da frente) pede TypeScript 5 e funciona com o 6, testado:
# sem esta linha, toda instalação mostraria um aviso falso.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
