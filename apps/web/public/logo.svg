<svg xmlns="http://www.w3.org/2000/svg" width="116" height="40" viewBox="0 0 116 40" role="img" aria-label="Sua logo">
  <!-- O lugar da sua logo. Troque este arquivo pela sua logo, com o mesmo nome (logo.svg). -->
  <style>
    .borda { fill: none; stroke: #a8a29e; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .fundo { fill: #f5f5f4; }
    .desenho { fill: none; stroke: #57534e; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .texto { fill: #292524; font: 600 15px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .borda { stroke: #78716c; }
      .fundo { fill: #292524; }
