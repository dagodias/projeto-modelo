      .texto { fill: #f5f5f4; }
    }
  </style>
  <rect class="borda" x="0.75" y="0.75" width="114.5" height="38.5" rx="10"/>
  <rect class="fundo" x="7" y="7" width="26" height="26" rx="7"/>
  <rect class="desenho" x="12.5" y="13" width="15" height="14" rx="2.5"/>
  <circle class="desenho" cx="17" cy="17.4" r="1.3"/>
  <path class="desenho" d="M13.2 25.4l4.1-3.6 2.6 2.2 3.3-3.3 3.6 3.4"/>
  <text class="texto" x="41" y="25.3">Sua logo</text>
</svg>
