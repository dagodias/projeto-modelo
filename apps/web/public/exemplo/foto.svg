<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Sua foto aqui">
  <!-- Foto de exemplo. Troque pela foto do seu negócio (de preferência em .webp ou .jpg, leve). -->
  <style>
    .claro { stop-color: #f5f5f4; }
    .escuro { stop-color: #e7e5e4; }
    .grade { stroke: #d6d3d1; }
    .desenho { fill: none; stroke: #a8a29e; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .texto { fill: #78716c; font: 600 40px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .claro { stop-color: #292524; }
      .escuro { stop-color: #1c1917; }
      .grade { stroke: #44403c; }
      .desenho { stroke: #78716c; }
      .texto { fill: #a8a29e; }
    }
  </style>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="claro"/>
      <stop offset="1" class="escuro"/>
    </linearGradient>
    <pattern id="grade" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" class="grade" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#fundo)"/>
  <rect width="1200" height="900" fill="url(#grade)" opacity="0.55"/>
  <g transform="translate(505 330)">
    <rect class="desenho" x="0" y="0" width="190" height="160" rx="26"/>
    <circle class="desenho" cx="58" cy="54" r="15"/>
    <path class="desenho" d="M18 138l50-44 32 27 40-40 36 34"/>
  </g>
  <text class="texto" x="600" y="580" text-anchor="middle">Sua foto aqui</text>
</svg>
