# O portão: a cada envio ao GitHub, a mesma checagem do computador, mais o build e os testes de tela.
# Se ficar vermelho, o código não está pronto para ir ao servidor.
name: Portão

on:
  push:
    branches: [main]
  pull_request:

# O portão só lê o código: nenhuma etapa dele escreve no repositório.
permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Segredos esquecidos no código
        run: pnpm segredos
      - name: O jeito de escrever (lint)
        run: pnpm lint
      - name: Os tipos (com o contrato gerado de novo a partir da API)
        run: pnpm typecheck
      - name: O contrato guardado bate com a API
        run: |
          git diff --exit-code HEAD -- apps/api/openapi.json apps/web/app/types/api.d.ts || {
            echo "::error::O contrato da API mudou e não foi guardado: rode pnpm contrato e faça o commit dos dois arquivos."
            exit 1
          }
      - name: Os testes
        run: pnpm test
      - name: O build de produção
        run: pnpm build
      - name: O navegador dos testes de tela
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Os testes de tela (o navegador abre o site)
        run: pnpm exec playwright test
